name: Validate Docs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry config virtualenvs.create true
          # Use --no-root to avoid trying to install the project as a package.
          # Fall back to pip if Poetry fails (e.g., version incompatibility).
          if poetry install --no-interaction --with dev --no-root; then
            echo "Poetry install succeeded"
          else
            echo "Poetry install failed, falling back to pip"
            python -m venv .venv
            source .venv/bin/activate
            python -m pip install --upgrade pip
            pip install -e '.[dev]'
          fi

      - name: Run tests with coverage
        run: |
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
            pytest --cov=core --cov-report=xml:coverage.xml -q
          else
            poetry run pytest --cov=core --cov-report=xml:coverage.xml -q
          fi

      - name: Generate coverage badge
        run: |
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
            python scripts/generate_coverage_badge.py --input coverage.xml --output docs/assets/coverage.svg
          else
            poetry run python scripts/generate_coverage_badge.py --input coverage.xml --output docs/assets/coverage.svg
          fi


