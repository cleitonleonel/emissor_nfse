name: Validate Docs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: |
          poetry config virtualenvs.in-project true
          poetry config virtualenvs.create true
          poetry install --no-interaction --with dev

      - name: Run tests with coverage
        run: |
          poetry run pytest --cov=core --cov-report=xml:coverage.xml -q

      - name: Generate coverage badge
        run: |
          poetry run python scripts/generate_coverage_badge.py --input coverage.xml --output docs/assets/coverage.svg

      - name: Ensure coverage badge is up to date
        run: git diff --exit-code -- docs/assets/coverage.svg

