name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (py3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache .venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-venv-3.12-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-venv-3.12-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-

      - name: Cache poetry
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-pypoetry-3.12-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-pypoetry-3.12-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          # Install Poetry (no version pinned so CI can work with any Poetry)
          pip install poetry
          poetry --version

      - name: Clear old virtualenv cache
        run: |
          # Remove cached .venv to avoid Poetry confusion from old metadata
          rm -rf .venv || true

      - name: Install dependencies (including dev)
        run: |
          # Try to install dev dependencies with Poetry (groups). If the Poetry
          # version in the runner doesn't support `--with <group>`, fall back
          # to creating a venv and installing editable extras via pip.
          set -e
          # If pyproject.toml changed since poetry.lock, regenerate lock so
          # `poetry install` can proceed. This avoids the CI failing when the
          # lock file is out-of-sync. We tolerate lock failures and rely on the
          # fallback below.
          poetry lock --no-interaction || true
          poetry config virtualenvs.in-project true || true
          poetry config virtualenvs.create true || true

          if poetry install --no-interaction --with dev --no-root; then
            echo "Poetry install --with dev (no-root) succeeded"
          else
            echo "Poetry install --with dev failed, falling back to pip editable install"
            python -m venv .venv
            source .venv/bin/activate
            python -m pip install --upgrade pip
            pip install -e '.[dev]'
          fi

      - name: Lint with ruff
        run: |
          # If a .venv was created (either by Poetry in-project or by our fallback),
          # activate it so ruff/pytest are available on PATH. Otherwise, use poetry.
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
            ruff check .
          else
            poetry run ruff check .
          fi

      - name: Run tests with coverage
        run: |
          if [ -f .venv/bin/activate ]; then
            source .venv/bin/activate
            pytest --cov=core --cov-report=xml:coverage.xml --cov-report=html -q
          else
            poetry run pytest --cov=core --cov-report=xml:coverage.xml --cov-report=html -q
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          overwrite: true
          path: |
            coverage.xml
            htmlcov


