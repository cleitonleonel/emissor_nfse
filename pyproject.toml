[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emissor_nfse"
version = "0.1.0"
description = "Cliente Python para automação do Emissor Nacional de NFS-e"
readme = "README.md"
requires-python = ">=3.12,<4.0"
package-mode = false
dependencies = [
  "beautifulsoup4==4.14.3",
  "certifi==2026.4.22",
  "cffi==2.0.0",
  "charset-normalizer==3.4.7",
  "cryptography==48.0.0",
  "idna==3.15",
  "lxml==6.1.0",
  "openpyxl",
  "python-dotenv==1.2.2",
  "reportlab==4.5.1",
  "requests==2.34.0",
  "signxml==4.4.0",
  "soupsieve==2.8.3",
  "typing_extensions==4.15.0",
  "urllib3==2.7.0",
]

[project.optional-dependencies]
dev = [
  "coverage==7.14.0",
  "iniconfig==2.3.0",
  "packaging==26.2",
  "pluggy==1.6.0",
  "pycparser==3.0",
  "Pygments==2.20.0",
  "pytest==8.4.2",
  "pytest-cov==4.1.0",
  "ruff==0.15.12",
]

# Some versions of Poetry (and CI images) expect groups to be defined under
# `tool.poetry.group.<name>.dependencies` for use with `--with <name>`.
[tool.poetry.group.dev.dependencies]
coverage = "7.14.0"
iniconfig = "2.3.0"
packaging = "26.2"
pluggy = "1.6.0"
pycparser = "3.0"
Pygments = "2.20.0"
pytest = "8.4.2"
pytest-cov = "4.1.0"
ruff = "0.15.12"

[project.scripts]
emissor-nfse = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

