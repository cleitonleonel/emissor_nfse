[project]
name = "pynfse"
version = "0.2.0"
description = "Cliente Python para automação do Emissor Nacional de NFS-e e API ADN v1.01 (NT 1.101)"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
  "beautifulsoup4==4.14.3",
  "certifi==2026.4.22",
  "cffi==2.0.0",
  "charset-normalizer==3.4.7",
  "cryptography>=43.0.0",
  "httpx2>=2.3.0",
  "idna>=3.15",
  "lxml==6.1.0",
  "pydantic>=2.0.0",
  "python-dotenv==1.2.2",
  "reportlab==4.5.1",
  "requests==2.34.0",
  "signxml>=4.0.0",
  "soupsieve==2.8.3",
  "typing_extensions==4.15.0",
  "urllib3==2.7.0",
  "fpdf2 (>=2.8.7,<3.0.0)",
  "qrcode (>=8.2,<9.0)",
]

[project.optional-dependencies]
dev = [
  "coverage==7.14.0",
  "iniconfig==2.3.0",
  "packaging==26.2",
  "pluggy==1.6.0",
  "pycparser==3.0",
  "Pygments==2.20.0",
  "pytest==8.4.2",
  "pytest-cov==4.1.0",
  "ruff==0.15.12",
]

[tool.poetry.group.dev.dependencies]
coverage = "7.14.0"
iniconfig = "2.3.0"
packaging = "26.2"
pluggy = "1.6.0"
pycparser = "3.0"
Pygments = "2.20.0"
pytest = "8.4.2"
pytest-cov = "4.1.0"
ruff = "0.15.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pynfse*"]

[tool.setuptools.package-data]
"pynfse" = ["assets/*"]
"pynfse.adn" = ["catalogs/*.json", "schemas_xsd/*.xsd"]
